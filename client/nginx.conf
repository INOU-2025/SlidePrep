server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Kept in sync with the API's own MAX_TOTAL_UPLOAD_BYTES (api/routes.py, env var
    # SLIDEPREP_MAX_TOTAL_UPLOAD_BYTES) — nginx doesn't read that env var, so if one
    # changes, update the other by hand. 30g covers a real whole-slide job (686 tile
    # positions x a few channels) with headroom. This was deliberately set to 0
    # (unlimited) in 552bccd; bounding it again matters because proxy_request_buffering
    # defaults to "on" — with no limit, nginx would buffer an entire oversized request
    # body itself before forwarding anything upstream, ahead of any check the API can
    # perform on the (streaming, chunked) body it actually receives.
    client_max_body_size 30g;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
