name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Real Redis for the API-level async-execution tests (tests/api/test_async_job.py)
    # and status-read tests — GET /jobs/{id} reads a genuine Redis result backend
    # (worker/celery_app.py), so a mock wouldn't exercise the real code path.
    # No REDIS_URL override needed: celery_app.py's default already targets
    # localhost:6379, which is where GitHub Actions service containers are
    # reachable from job steps.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Same system packages the Dockerfile already installs — Java for
      # Ashlar's OME-TIFF stitching, libvips-tools for the vips CLI used by
      # DZI generation, the rest for OpenCV/build requirements.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 build-essential default-jdk libvips-tools zlib1g-dev libjpeg-dev

      # LaMa inpainting weights (~196 MB) are downloaded on first use, not
      # bundled with the pip package — cache them so repeated CI runs don't
      # re-download every time.
      - name: Cache LaMa inpainting model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: ${{ runner.os }}-lama-model-v0.1.2

      # requirements.txt pins torch/torchvision to CUDA-tagged (+cu128) builds —
      # correct for the Dockerfile/production, confirmed to install cleanly on
      # linux/amd64 (verified directly: `docker build --platform linux/amd64`
      # succeeds as-is). But that pulls the CUDA runtime libraries too
      # (nvidia-cublas-cu12, nvidia-cudnn-cu12, etc. — a large, unused download
      # on a GPU-less runner), so here specifically we install the same
      # torch/torchvision *version numbers* without the CUDA tag instead —
      # runs on CPU either way (simple_lama_inpainting auto-detects
      # torch.cuda.is_available(), which is always False here).
      - name: Install Python dependencies (CPU-only torch/torchvision — no GPU on this runner)
        run: |
          grep -vE "^torch(vision)?==" requirements.txt > requirements-ci.txt
          pip install torch==2.7.1 torchvision==0.22.1
          pip install -r requirements-ci.txt
          pip install --no-deps simple-lama-inpainting==0.1.2

      - name: Run test suite
        run: pytest tests/ -v

  container-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docker-compose.yml alone is a complete, valid stack — no .env file
      # or dev overlay needed. Brings up api + worker + redis + frontend and
      # confirms they actually build and start together, which no unit or
      # API-level test exercises (those run the FastAPI app in-process).
      - name: Build and start the compose stack
        run: docker compose up --build -d

      # No per-service healthcheck is defined in docker-compose.yml, so
      # readiness is confirmed by polling the API's own root route
      # (api/app.py's GET / — dependency-free, no GPU/model access at
      # startup) rather than trusting container "Up" status alone.
      - name: Wait for the API to respond
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "API responded after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "API never responded within 5 minutes"
          docker compose logs
          exit 1

      # Confirms the worker container didn't build/start then immediately
      # crash-loop — container-startup coverage should mean all services,
      # not just the one being polled.
      - name: Confirm the worker container is still running
        run: |
          if [ "$(docker compose ps --status=running --services | grep -c '^worker$')" != "1" ]; then
            echo "worker container is not running"
            docker compose ps
            docker compose logs worker
            exit 1
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down
